<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- "L" for Lisvet, in the ring of the previous R mark: same 19px ring
       weight, same 276px cap height and 54px stem, so the two read as the
       same family. The ink flips to white on a dark browser theme. -->
  <style>
    .ring { fill: none; stroke: #000; stroke-width: 19; }
    .glyph { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #fff; }
      .glyph { fill: #fff; }
    }
  </style>
  <circle class="ring" cx="250" cy="250" r="236.5"/>
  <path class="glyph" d="M147 112 H201 V338 H353 V388 H147 Z"/>
</svg>
